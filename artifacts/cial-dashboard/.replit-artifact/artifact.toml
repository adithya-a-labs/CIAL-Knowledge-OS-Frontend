kind = "web"
previewPath = "/"
title = "CIAL Knowledge OS"
version = "1.0.0"
id = "artifacts/cial-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23286

[services.development]
run = "pnpm --filter @workspace/cial-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cial-dashboard", "run", "build" ]
publicDir = "artifacts/cial-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23286"
BASE_PATH = "/"
